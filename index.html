<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Кошелёк</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#0f0f0f;--text:#fff;--hint:#8e8e93;--btn:#2ea6ff;--card:#1c1c1e;--green:#34c759;--red:#ff3b30;--border:rgba(128,128,128,.15);--redbg:rgba(255,59,48,.1)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0 0 70px;min-height:100vh}.header{display:flex;align-items:center;justify-content:space-between;padding:16px;font-size:20px;font-weight:bold}.header-left{display:flex;align-items:center;gap:12px}.back-arrow{font-size:24px}.search-bar{margin:0 16px 16px;background:var(--card);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:8px;color:var(--hint);font-size:15px}.tabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--border);margin-bottom:8px}.tab{padding:8px 0;font-size:15px;color:var(--hint);border-bottom:2px solid transparent}.tab.active{color:var(--text);border-bottom-color:var(--btn);font-weight:bold}.token-list{display:flex;flex-direction:column;padding:0 16px}.token-item{border-bottom:1px solid var(--border);overflow:hidden}.token-header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer}.token-info{display:flex;align-items:center;gap:12px;flex:1}.token-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;color:#fff}.token-names{display:flex;flex-direction:column;gap:2px}.token-name{font-weight:500;font-size:15px}.token-ticker{font-size:13px;color:var(--hint)}.token-price-info{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-right:12px}.token-price{font-weight:600;font-size:15px}.token-change{font-size:13px;font-weight:500}.positive{color:var(--green)}.negative{color:var(--red)}.chevron{width:8px;height:8px;border-right:2px solid var(--hint);border-bottom:2px solid var(--hint);transform:rotate(45deg);transition:.3s;margin-right:4px}.token-item.expanded .chevron{transform:rotate(-135deg);border-color:var(--btn)}.chart-wrapper{max-height:0;opacity:0;overflow:hidden;transition:.5s}.token-item.expanded .chart-wrapper{max-height:400px;opacity:1;padding-bottom:16px}.timeframe-pills{display:flex;gap:6px;margin-bottom:12px}.pill{flex:1;padding:6px 0;border-radius:6px;border:none;background:var(--card);color:var(--hint);font-size:12px;font-weight:600;cursor:pointer}.pill.active{background:var(--btn);color:#fff}.chart-container{height:180px;position:relative;margin-bottom:16px}.trade-activity{background:var(--redbg);border:1px solid rgba(255,59,48,.3);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}.activity-title{font-size:12px;color:var(--hint);text-transform:uppercase}.activity-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.ur-input-group{display:flex;align-items:center;background:rgba(0,0,0,.3);border-radius:6px;padding:4px 8px;flex:1}.ur-label{color:var(--red);font-weight:bold;font-size:16px;margin-right:8px}.ur-input{background:transparent;border:none;color:var(--text);font-size:16px;font-weight:bold;width:100%;outline:none}.ur-value{font-size:16px;font-weight:bold;color:var(--red)}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card);display:flex;justify-content:space-around;padding:12px 0 20px;border-top:1px solid var(--border)}.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--hint)}.nav-item.active{color:var(--btn)}.nav-icon{font-size:20px}</style></head><body><div class="header"><div class="header-left"><span class="back-arrow">←</span><span>Кошелёк</span></div><div>⋮</div></div><div class="search-bar"><span>🔍</span><span>Поиск по тикеру или названию</span></div><div class="tabs"><div class="tab">Все</div><div class="tab active">Токены</div><div class="tab">Акции</div><div class="tab">Фонды</div></div><div class="token-list" id="tokenList"></div><div class="bottom-nav"><div class="nav-item"><span class="nav-icon">🏦</span><span>Резерв</span></div><div class="nav-item active"><span class="nav-icon">%</span><span>Доход</span></div><div class="nav-item"><span class="nav-icon">💼</span><span>Резерв</span></div></div><script>
const PROXY='https://bot-ashy-one.vercel.app/api/proxy?url=';async function fp(u){const r=await fetch(PROXY+encodeURIComponent(u));if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}const tg=window.Telegram.WebApp;tg.ready();tg.expand();const tokens=[{id:'gram',name:'Gram (бывш. Toncoin)',ticker:'GRAM',price:122.62,change:1.14,icon:'💎',iconBg:'#2ea6ff',isReal:true,cgId:'the-open-network'},{id:'usdt',name:'USDT',ticker:'USDT',price:83.99,change:-0.14,icon:'₮',iconBg:'#26a17b',isReal:true,cgId:'tether'},{id:'tonstakers',name:'Tonstakers TON',ticker:'tsTON',price:142.22,change:1.19,icon:'💧',iconBg:'#0098ea',isReal:false},{id:'utya',name:'Utya',ticker:'UTYA',price:2.59,change:6.09,icon:'🦆',iconBg:'#ffcc00',isReal:false},{id:'atf',name:'AI Trading Forex',ticker:'ATF',price:0.05,change:-3.32,icon:'🤖',iconBg:'#333',isReal:false},{id:'redo',name:'Resistance Dog',ticker:'REDO',price:5.00,change:5.01,icon:'🐕',iconBg:'#ff4500',isReal:false},{id:'cherry',name:'Hot Cherry',ticker:'CHERRY',price:0.01,change:-1.78,icon:'🍒',iconBg:'#ff69b4',isReal:false},{id:'dogs',name:'Dogs',ticker:'DOGS',price:0.01,change:1.15,icon:'🐶',iconBg:'#8b4513',isReal:false}];const tl=document.getElementById('tokenList');let cc=null;const fr=v=>v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';async function lrp(){try{const d=await fp('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network,tether&vs_currencies=rub&include_24hr_change=true');if(d['the-open-network']){tokens[0].price=d['the-open-network'].rub;tokens[0].change=d['the-open-network'].rub_24h_change||0}if(d['tether']){tokens[1].price=d['tether'].rub;tokens[1].change=d['tether'].rub_24h_change||0}}catch(e){console.error('Price error:',e)}rtl()}function gm(bp,tf){let n=120,v=.003;if(tf==='7D'){n=168;v=.008}else if(tf==='1M'){n=30;v=.015}else if(tf==='1Y'){n=52;v=.025}else if(tf==='ALL'){n=100;v=.04}let d=[],p=bp*(1-Math.random()*.05);for(let i=0;i<n;i++){let c=(Math.random()-.5)*v*p;let t=(bp-p)/(n-i);p+=c+t;if(p<.001)p=.001;d.push(p)}d[d.length-1]=bp;return d}async function dc(cid,t,tf){const c=document.getElementById(cid).getContext('2d');if(cc)cc.destroy();let data,labels=[];if(t.isReal&&t.cgId){try{const dm={'1D':1,'7D':7,'1M':30,'1Y':365,'ALL':'max'};const days=dm[tf]||1;const cd=await fp(`https://api.coingecko.com/api/v3/coins/${t.cgId}/market_chart?vs_currency=rub&days=${days}`);if(cd.prices&&cd.prices.length>0){const ps=cd.prices;const step=Math.max(1,Math.floor(ps.length/60));data=[];labels=[];for(let i=0;i<ps.length;i+=step){data.push(ps[i][1]);labels.push(new Date(ps[i][0]).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))}data.push(ps[ps.length-1][1]);labels.push('Сейчас')}}catch(e){data=gm(t.price,tf);labels=['00:00','06:00','12:00','18:00','Сейчас']}}else{data=gm(t.price,tf);labels=['00:00','06:00','12:00','18:00','Сейчас']}const ip=t.change>=0,cl=ip?'#34c759':'#ff3b30';const g=c.createLinearGradient(0,0,0,180);g.addColorStop(0,ip?'rgba(52,199,89,.4)':'rgba(255,59,48,.4)');g.addColorStop(1,'rgba(0,0,0,0)');cc=new Chart(c,{type:'line',data:{labels,datasets:[{data,borderColor:cl,backgroundColor:g,borderWidth:2,pointRadius:0,fill:true,tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>fr(x.parsed.y)}}},scales:{x:{display:true,ticks:{color:'#8e8e93',font:{size:10},maxTicksLimit:5}},y:{display:false,min:Math.min(...data)*.98,max:Math.max(...data)*1.02}}}})}function rtl(){tl.innerHTML='';tokens.forEach(t=>{const ck=t.change>=0?'positive':'negative',cs=t.change>=0?'↑':'↓';tl.insertAdjacentHTML('beforeend',`<div class="token-item" data-id="${t.id}"><div class="token-header"><div class="token-info"><div class="token-icon" style="background:${t.iconBg}">${t.icon}</div><div class="token-names"><span class="token-name">${t.name}</span><span class="token-ticker">${t.ticker}</span></div></div><div class="token-price-info"><span class="token-price">${fr(t.price)}</span><span class="token-change ${ck}">${cs} ${Math.abs(t.change).toFixed(2)}%</span></div><div class="chevron"></div></div><div class="chart-wrapper"><div class="timeframe-pills"><button class="pill active" data-tf="1D">1Д</button><button class="pill" data-tf="7D">7Д</button><button class="pill" data-tf="1M">1М</button><button class="pill" data-tf="1Y">1Г</button><button class="pill" data-tf="ALL">Всё</button></div><div class="chart-container"><canvas id="chart-${t.id}"></canvas></div><div class="trade-activity"><div class="activity-title">Торговая активность</div><div class="activity-row"><div class="ur-input-group"><span class="ur-label">ur</span><input type="number" class="ur-input" placeholder="0" min="0" step="any"></div><span class="ur-value">0.00 ₽</span></div></div></div></div>`)});document.querySelectorAll('.token-header').forEach(h=>h.addEventListener('click',()=>{const it=h.closest('.token-item'),id=it.dataset.id,t=tokens.find(x=>x.id===id);if(it.classList.contains('expanded')){it.classList.remove('expanded');if(cc)cc.destroy();cc=null;return}document.querySelectorAll('.token-item').forEach(e=>e.classList.remove('expanded'));if(cc)cc.destroy();cc=null;it.classList.add('expanded');setTimeout(()=>dc(`chart-${t.id}`,t,'1D'),150)}));document.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const it=b.closest('.token-item'),t=tokens.find(x=>x.id===it.dataset.id);it.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');dc(`chart-${t.id}`,t,b.dataset.tf)}));document.querySelectorAll('.ur-input').forEach(i=>i.addEventListener('input',e=>{const it=i.closest('.token-item'),t=tokens.find(x=>x.id===it.dataset.id),a=parseFloat(e.target.value)||0;it.querySelector('.ur-value').textContent=fr(a*t.price)}))}lrp();</script></body></html>
