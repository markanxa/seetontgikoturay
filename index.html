<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Test</title><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:16px}.card{background:#1c1c1e;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px}.ok{color:#34c759}.fail{color:#ff3b30}.hint{color:#8e8e93;font-size:11px}pre{background:#000;padding:8px;border-radius:6px;font-size:10px;max-height:120px;overflow:auto;word-break:break-all;white-space:pre-wrap}button{padding:8px 14px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;margin:4px 0}.badge{float:right}</style></head><body><h2>API Test</h2><button id="runAll" style="background:#2ea6ff;border:none;padding:12px;width:100%;font-weight:bold">Запустить все</button><div id="out"></div><script>const PROXY='https://bot-ashy-one.vercel.app/api/proxy?url=';const tests=[{n:'CoinGecko цена',u:'https://api.coingecko.com/api/v3/simple/price?ids=the-open-network,tether&vs_currencies=rub&include_24hr_change=true'},{n:'CoinGecko график',u:'https://api.coingecko.com/api/v3/coins/the-open-network/market_chart?vs_currency=rub&days=1'},{n:'Binance 24h',u:'https://api.binance.com/api/v3/ticker/24hr?symbol=TONUSDT'},{n:'Binance klines',u:'https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=1h&limit=24'},{n:'OKX',u:'https://www.okx.com/api/v5/market/ticker?instId=TON-USDT'},{n:'Bybit',u:'https://api.bybit.com/v5/market/tickers?category=spot&symbol=TONUSDT'},{n:'KuCoin',u:'https://api.kucoin.com/api/v1/market/stats?symbol=TON-USDT'},{n:'CoinCap',u:'https://api.coincap.io/v2/assets/the-open-network'}];const out=document.getElementById('out');let chart=null;function makeCard(i,t){const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+(i+1)+'. '+t.n+'</b> <span class="badge" id="b'+i+'">⏳</span><div class="hint">'+t.u+'</div><button onclick="run('+i+')">Запустить</button><div id="m'+i+'" class="hint"></div><div id="c'+i+'" style="display:none;height:150px;margin:8px 0"><canvas id="cv'+i+'"></canvas></div><pre id="o'+i+'">—</pre>';out.appendChild(d)}async function fetchP(url,timeout=12000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);const start=performance.now();try{const res=await fetch(PROXY+encodeURIComponent(url),{signal:controller.signal});const ms=Math.round(performance.now()-start);const text=await res.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!res.ok)throw new Error('HTTP '+res.status+': '+(typeof data==='string'?data.slice(0,150):JSON.stringify(data).slice(0,150)));return{data,ms}}catch(e){const ms=Math.round(performance.now()-start);if(e.name==='AbortError')throw new Error('Таймаут '+(timeout/1000)+'с');throw e}finally{clearTimeout(timer)}}async function run(i){const t=tests[i];document.getElementById('b'+i).textContent='⏳';document.getElementById('b'+i).className='badge';try{const{data,ms}=await fetchP(t.u);document.getElementById('b'+i).textContent='✅';document.getElementById('b'+i).className='badge ok';document.getElementById('m'+i).innerHTML='<span class="ok">OK</span> '+ms+'мс';document.getElementById('o'+i).textContent=JSON.stringify(data,null,2).slice(0,800);if(t.n.includes('график')&&data.prices){document.getElementById('c'+i).style.display='block';if(chart)chart.destroy();const points=data.prices.map(p=>p[1]);const labels=data.prices.map(p=>new Date(p[0]).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));chart=new Chart(document.getElementById('cv'+i),{type:'line',data:{labels,datasets:[{data:points,borderColor:'#2ea6ff',borderWidth:2,pointRadius:0,tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:true,ticks:{color:'#8e8e93',font:{size:9},maxTicksLimit:4}},y:{display:false}}}})}}catch(e){document.getElementById('b'+i).textContent='❌';document.getElementById('b'+i).className='badge fail';document.getElementById('m'+i).innerHTML='<span class="fail">ОШИБКА</span>';document.getElementById('o'+i).textContent='Ошибка: '+e.message}}tests.forEach((t,i)=>makeCard(i,t));document.getElementById('runAll').onclick=async()=>{for(let i=0;i<tests.length;i++)await run(i)};</script></body></html>
